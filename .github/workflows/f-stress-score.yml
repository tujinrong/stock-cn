name: F01 stress score
on:
  push:
    branches: [main]
    paths:
      - 'f-stress-evaluations/*.json'
permissions:
  contents: write
concurrency:
  group: f01-stress-score
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - name: Score pending F01 stress evaluations
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for file in f-stress-evaluations/*.json; do
            [ -f "$file" ] || continue
            eval_id=$(python -c "import json; print(json.load(open('$file'))['eval_id'])")
            if [ -f "runs/evaluations/$eval_id/summary.json" ]; then continue; fi
            python tools/run_f_stress_score.py --request "$file"
            found=1
          done
          test "$found" -eq 1 || echo "No pending F01 stress evaluation."
      - name: Publish stress results
        run: |
          git add -- runs/evaluations
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "eval: F01 historical stress score [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
