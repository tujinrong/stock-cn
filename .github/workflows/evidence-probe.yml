name: Official disclosure evidence probe
on:
  push:
    branches: [main]
    paths:
      - 'research-requests/evidence/*.json'
permissions:
  contents: write
concurrency:
  group: official-evidence-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Run pending evidence probes
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for file in research-requests/evidence/*.json; do
            [ -f "$file" ] || continue
            probe_id=$(python -c "import json; print(json.load(open('$file'))['probe_id'])")
            if [ -f "runs/research/evidence/$probe_id/summary.json" ]; then
              continue
            fi
            symbols=$(python -c "import json; print(' '.join(json.load(open('$file'))['symbols']))")
            days=$(python -c "import json; print(json.load(open('$file')).get('lookback_days',120))")
            pages=$(python -c "import json; print(json.load(open('$file')).get('max_pages',3))")
            python tools/run_evidence_probe.py --probe-id "$probe_id" --symbols $symbols --lookback-days "$days" --max-pages "$pages"
            found=1
          done
          test "$found" -eq 1 || echo "No pending evidence probe."
      - name: Verify strategy/formal state unchanged
        shell: bash
        run: |
          set -euo pipefail
          for f in strategies/*/variants/*/holdings.json \
                   strategies/*/variants/*/holdings.md \
                   strategies/*/variants/*/research_state.json \
                   strategies/*/variants/*/formal_prompt.json; do
            [ -f "$f" ] || continue
            git diff --exit-code -- "$f"
          done
      - name: Publish compact evidence metadata
        run: |
          git add -- runs/research/evidence
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "research: official disclosure evidence probe [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
