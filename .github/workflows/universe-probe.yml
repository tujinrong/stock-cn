name: AI_SELECT universe probe
on:
  push:
    branches: [main]
    paths:
      - 'research-requests/universe/*.json'
permissions:
  contents: write
concurrency:
  group: ai-select-universe-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Run pending universe probes
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for file in research-requests/universe/*.json; do
            [ -f "$file" ] || continue
            probe_id=$(python -c "import json; print(json.load(open('$file'))['probe_id'])")
            if [ -f "runs/research/universe/$probe_id/summary.json" ]; then
              continue
            fi
            limit=$(python -c "import json; print(json.load(open('$file')).get('candidate_limit',30))")
            sample=$(python -c "import json; print(json.load(open('$file')).get('history_sample',5))")
            python tools/run_universe_probe.py --probe-id "$probe_id" --candidate-limit "$limit" --history-sample "$sample"
            found=1
          done
          test "$found" -eq 1 || echo "No pending universe probe."
      - name: Verify formal strategy files unchanged
        shell: bash
        run: |
          set -euo pipefail
          for f in strategies/*/variants/*/holdings.json \
                   strategies/*/variants/*/holdings.md \
                   strategies/*/variants/*/improvement_state.json \
                   strategies/*/variants/*/simulation_prompt.json \
                   strategies/*/variants/*/formal_prompt.json; do
            [ -f "$f" ] || continue
            git diff --exit-code -- "$f"
          done
      - name: Publish compact research outputs
        run: |
          git add -- runs/research/universe
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "research: bounded AI_SELECT universe probe [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
