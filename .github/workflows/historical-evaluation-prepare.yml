name: Historical AI evaluation prepare
on:
  push:
    branches: [main]
    paths:
      - 'evaluation-plans/*.json'
permissions:
  contents: write
concurrency:
  group: historical-evaluation-prepare
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Prepare every plan changed in this commit
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for file in evaluation-plans/*.json; do
            [ -f "$file" ] || continue
            eval_id=$(python -c "import json; print(json.load(open('$file'))['eval_id'])")
            if [ ! -f "runs/evaluations/$eval_id/manifest.json" ]; then
              python tools/run_evaluation_plan.py --eval-id "$eval_id" --phase prepare
              found=1
            fi
          done
          test "$found" -eq 1 || echo "No new evaluation plan required preparation."
      - name: Verify formal accounts unchanged
        run: git diff --exit-code -- 'strategies/*/variants/*/holdings.json' 'strategies/*/variants/*/holdings.md'
      - name: Publish causal task packages
        run: |
          git add -- runs/evaluations strategies/*/variants/*/simulations/eval-*
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "eval: prepare causal historical AI tasks [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
