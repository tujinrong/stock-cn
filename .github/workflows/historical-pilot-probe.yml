name: Historical pilot universe probe
on:
  push:
    branches: [main]
    paths:
      - 'research-requests/historical-pilot/*.json'
permissions:
  contents: write
concurrency:
  group: historical-pilot-universe-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - name: Probe pending fixed universes
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for file in research-requests/historical-pilot/*.json; do
            [ -f "$file" ] || continue
            probe_id=$(python -c "import json; print(json.load(open('$file'))['probe_id'])")
            if [ -f "runs/research/historical-pilot/$probe_id/summary.json" ]; then continue; fi
            python tools/run_historical_pilot_probe.py --request "$file"
            found=1
          done
          test "$found" -eq 1 || echo "No pending historical pilot probe."
      - name: Publish summaries
        run: |
          git add -- runs/research/historical-pilot
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "research: historical fixed-universe pilot probe [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
