name: Simulation validation
on:
  push:
    branches: [main]
    paths:
      - 'src/stock_cn/sim*.py'
      - 'src/stock_cn/variant_prompts.py'
      - 'src/stock_cn/paper_core.py'
      - 'src/stock_cn/formal_paper.py'
      - 'src/stock_cn/time_travel.py'
      - 'tools/*variants.py'
      - 'tools/refine_prompt_smoke.py'
      - 'tests/test_*simulation.py'
      - 'tests/test_prompt_lab.py'
      - 'tests/test_mode_parity.py'
      - 'tests/test_time_travel.py'
      - '.github/workflows/simulation-validation.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: simulation-validation-main
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TEST_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test environment
        run: python -m pip install -e '.[dev]'
      - name: Build independent full variant prompts and accounts
        run: python tools/migrate_variants.py
      - name: Unit, causal-prefix, mode-parity and ten-round-limit regression tests
        run: python -m pytest -q --junitxml="$RUNNER_TEMP/pytest.xml"
      - name: One bounded structural prompt improvement (not an AI investment test)
        run: |
          python tools/refine_prompt_smoke.py
          python tools/migrate_variants.py
      - name: Thirteen independent variants, five simulated sessions
        run: python -m stock_cn.sim_cli selfcheck --test-id "$TEST_ID" --variants A01 A02 A03 C01 C02 C03 D01 D02 D03 E01 E02 E03 F01 --workers 2 --max-calls 100
      - name: Probe real historical daily sources
        id: sources
        continue-on-error: true
        run: python -m stock_cn.sim_cli probe --test-id "$TEST_ID" --start 2025-08-01 --end 2025-08-08 --output "$RUNNER_TEMP/stock-cn-history.json"
      - name: Real-price flow replay when available (not AI investment evaluation)
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/stock-cn-history.json" ]; then
            python -m stock_cn.sim_cli replay --variant A02 --test-id "$TEST_ID-real" --data "$RUNNER_TEMP/stock-cn-history.json" --agent scripted-smoke --max-calls 10
            python -m stock_cn.sim_cli audit --variant A02 --test-id "$TEST_ID-real"
          fi
      - name: Real-history time-travel prompt with multi-timeframe K-lines
        id: timetravel
        shell: bash
        run: |
          python -m stock_cn.sim_cli probe --test-id "$TEST_ID-time-source" --start 2024-07-05 --end 2025-08-08 --output "$RUNNER_TEMP/stock-cn-time-travel.json"
          if [ -f "$RUNNER_TEMP/stock-cn-time-travel.json" ]; then
            python -m stock_cn.sim_cli time-travel --variant A02 --test-id "$TEST_ID-time-travel" --data "$RUNNER_TEMP/stock-cn-time-travel.json" --date 2025-08-01
            python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('strategies/A/variants/A02/simulations') / (os.environ['TEST_ID'] + '-time-travel')
          matches = list(root.glob('requests/*/time_travel.json'))
          assert len(matches) == 1
          obj = json.loads(matches[0].read_text())
          assert obj['target_date'] == '2025-08-01'
          assert obj['knowledge_cutoff'].startswith('2025-08-01')
          assert obj['symbols']
          assert all(x['kline']['daily_last20'] for x in obj['symbols'])
          assert any(x['kline']['weekly_last12'] for x in obj['symbols'])
          assert any(x['kline']['monthly_last12'] for x in obj['symbols'])
          assert all(max(k['date'] for k in x['kline']['daily_last20']) <= '2025-08-01' for x in obj['symbols'])
          assert all(x['history_coverage']['sessions'] >= 200 for x in obj['symbols'])
          assert any(x['history_coverage']['has_250_sessions'] for x in obj['symbols'])
          assert all((x['range_position_0_to_1']['250_sessions'] is not None) == x['history_coverage']['has_250_sessions'] for x in obj['symbols'])
          byd = next(x for x in obj['symbols'] if x['symbol'] == '002594.SZ')
          assert byd['suspected_price_basis_break'] is not None
          assert byd['continuous_analysis_sessions'] < byd['observations']
          assert byd['moving_average']['ma20'] is None
          PY
          fi
      - name: Preserve old formal holdings and save test metadata
        env:
          SOURCE_OUTCOME: ${{ steps.sources.outcome }}
        run: |
          git diff --exit-code -- 'strategies/*/holdings.json' 'strategies/*/holdings.md' 'strategies/*/init.json' 'strategies/*/ai_input_template.md'
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          root = Path('runs/simulations') / os.environ['TEST_ID']
          root.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(Path(os.environ['RUNNER_TEMP']) / 'pytest.xml', root / 'pytest.xml')
          accounts = list(Path('strategies').glob('*/variants/*/holdings.json'))
          assert len(accounts) == 13
          assert all(json.loads(p.read_text())['status'] == 'NOT_INITIALIZED' for p in accounts)
          (root / 'ci.json').write_text(json.dumps({'source_commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'source_probe_outcome': os.environ['SOURCE_OUTCOME'], 'paid_model_called': False, 'formal_execution': False, 'independent_variants': len(accounts)}, indent=2) + '\n')
          PY
      - name: Source snapshot for reproducible debugging
        if: always()
        run: git archive --format=zip --output="$RUNNER_TEMP/source.zip" HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runs/simulations/${{ env.TEST_ID }}/
            strategies/*/variants/*/
            ${{ runner.temp }}/pytest.xml
            ${{ runner.temp }}/source.zip
      - name: Publish authorized variant migration and simulation results (non-force)
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git add -- AGENTS.md strategies src/stock_cn/sim_cli.py "runs/simulations/$TEST_ID"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "test: independent variants and causal simulation $TEST_ID [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
