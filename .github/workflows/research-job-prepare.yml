name: AI research job prepare
on:
  push:
    branches: [main]
    paths:
      - 'research-job-requests/*.json'
permissions:
  contents: write
concurrency:
  group: ai-research-job-prepare
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Prepare pending research jobs
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for file in research-job-requests/*.json; do
            [ -f "$file" ] || continue
            job_id=$(python -c "import json; print(json.load(open('$file'))['job_id'])")
            if [ -f "runs/research/jobs/$job_id/request.json" ]; then
              continue
            fi
            python tools/run_research_job_request.py --request "$file"
            found=1
          done
          test "$found" -eq 1 || echo "No pending research jobs."
      - name: Verify accounts/prompts/formal research state unchanged
        shell: bash
        run: |
          set -euo pipefail
          for f in strategies/*/variants/*/holdings.json \
                   strategies/*/variants/*/holdings.md \
                   strategies/*/variants/*/formal_prompt.json \
                   strategies/*/variants/*/research_state.json; do
            [ -f "$f" ] || continue
            git diff --exit-code -- "$f"
          done
      - name: Publish research task packages
        run: |
          git add -- runs/research/jobs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "research: prepare AI research job packages [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
