name: Research decision execution check
on:
  push:
    branches: [main]
    paths:
      - 'research-execution-requests/*.json'
permissions:
  contents: write
concurrency:
  group: research-decision-execution-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Check pending locked decisions
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for file in research-execution-requests/*.json; do
            [ -f "$file" ] || continue
            request_id=$(python -c "import json; print(json.load(open('$file'))['request_id'])")
            marker="runs/research-execution-requests/$request_id.json"
            if [ -f "$marker" ]; then
              continue
            fi
            python tools/run_research_execution_request.py --request "$file"
            mkdir -p runs/research-execution-requests
            cp "$file" "$marker"
            found=1
          done
          test "$found" -eq 1 || echo "No pending research execution checks."
      - name: Verify formal state unchanged
        shell: bash
        run: |
          set -euo pipefail
          for f in strategies/*/variants/*/holdings.json \
                   strategies/*/variants/*/holdings.md \
                   strategies/*/variants/*/formal_prompt.json \
                   strategies/*/variants/*/research_state.json; do
            [ -f "$f" ] || continue
            git diff --exit-code -- "$f"
          done
      - name: Publish execution check results
        run: |
          git add -- runs/research-decisions runs/research-execution-requests
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "research: record deferred execution checks [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
