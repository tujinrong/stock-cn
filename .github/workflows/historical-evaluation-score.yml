name: Historical AI evaluation score
on:
  push:
    branches: [main]
    paths:
      - 'evaluation-score-requests/*.json'
permissions:
  contents: write
concurrency:
  group: historical-evaluation-score
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Score only after answer files already exist
        shell: bash
        run: |
          set -euo pipefail
          files=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^evaluation-score-requests/.*\.json$' || true)
          test -n "$files"
          while IFS= read -r file; do
            eval_id=$(python -c "import json; print(json.load(open('$file'))['eval_id'])")
            python tools/run_evaluation_plan.py --eval-id "$eval_id" --phase score
          done <<< "$files"
      - name: Verify prompt-improvement state and formal accounts are not changed by scoring
        run: |
          git diff --exit-code -- 'strategies/*/variants/*/holdings.json' 'strategies/*/variants/*/holdings.md' 'strategies/*/variants/*/improvement_state.json' 'strategies/*/variants/*/simulation_prompt.json' 'strategies/*/variants/*/formal_prompt.json'
      - name: Publish locked decisions and outcome scores
        run: |
          git add -- runs/evaluations strategies/*/variants/*/simulations/eval-*
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "eval: score locked historical AI decisions [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
