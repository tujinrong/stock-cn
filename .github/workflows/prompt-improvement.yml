name: Prompt stability improvement
on:
  push:
    branches: [main]
    paths:
      - 'prompt-improvement-requests/*.json'
permissions:
  contents: write
concurrency:
  group: prompt-stability-improvement
  cancel-in-progress: false
jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Run pending bounded improvements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/prompt-improvements
          found=0
          for file in prompt-improvement-requests/*.json; do
            [ -f "$file" ] || continue
            status=$(python -c "import json; print(json.load(open('$file')).get('status','REQUESTED'))")
            [ "$status" = "REQUESTED" ] || continue
            request_id=$(python -c "import json; print(json.load(open('$file'))['request_id'])")
            [ -f "runs/prompt-improvements/$request_id.json" ] && continue
            variant=$(python -c "import json; print(json.load(open('$file'))['variant'])")
            rounds=$(python -c "import json; print(json.load(open('$file')).get('rounds',1))")
            issues=$(python -c "import json; print(' '.join(json.load(open('$file'))['issues']))")
            python tools/run_prompt_improvement.py --variant "$variant" --rounds "$rounds" --issues $issues > "runs/prompt-improvements/$request_id.json"
            found=1
          done
          test "$found" -eq 1 || echo "No pending prompt improvement."
      - name: Verify immutable/formal state unchanged
        shell: bash
        run: |
          set -euo pipefail
          for f in strategies/*/variants/*/prompt.md \
                   strategies/*/variants/*/formal_prompt.json \
                   strategies/*/variants/*/holdings.json \
                   strategies/*/variants/*/holdings.md \
                   strategies/*/variants/*/research_state.json; do
            [ -f "$f" ] || continue
            git diff --exit-code -- "$f"
          done
      - name: Publish simulation-only prompt candidates
        run: |
          git add -- runs/prompt-improvements \
            strategies/*/variants/*/improvement_state.json \
            strategies/*/variants/*/simulation_prompt.json \
            strategies/*/variants/*/prompt_versions \
            strategies/*/variants/*/improvements
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "prompt: bounded stability improvement [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
